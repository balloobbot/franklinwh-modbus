[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests that can run in isolation
    integration: Integration tests that require hardware or external services
    slow: Tests that take longer than 1 second
    hardware: Tests that require actual FranklinWH hardware
    destructive: Tests that write to hardware (requires --destructive-enabled)
