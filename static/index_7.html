                <!-- Control Tab -->
                <div x-show="currentTab==='control'" x-transition class="max-w-2xl mx-auto space-y-6">
                    <div class="bg-surface rounded-2xl shadow p-6">
                        <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fas fa-sliders-h text-primary"></i> Operating Mode</h2>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                            <template x-for="mode in [{id:0,name:'Standby',icon:'fa-power-off',desc:'System idle'},{id:1,name:'Normal',icon:'fa-play',desc:'Auto operation'},{id:2,name:'Backup Reserve',icon:'fa-shield-alt',desc:'Keep reserve'},{id:3,name:'Self-Consumption',icon:'fa-home',desc:'Maximize self-use'},{id:4,name:'Time-of-Use',icon:'fa-clock',desc:'Schedule based'}]" :key="mode.id">
                                <button @click="setOperatingMode(mode.id)" :disabled="settingMode" :class="`p-4 rounded-xl border-2 transition-all text-left ${data.extensions?.operatingMode===mode.id?'border-primary bg-primary/5':'border-gray-200 dark:border-gray-700 hover:border-primary/50'}`">
                                    <i :class="`fas ${mode.icon} text-2xl mb-2 ${data.extensions?.operatingMode===mode.id?'text-primary':'text-gray-400'}`"></i>
                                    <p class="font-semibold" x-text="mode.name"></p>
                                    <p class="text-xs text-gray-500" x-text="mode.desc"></p>
                                </button>
                            </template>
                        </div>
                    </div>
                    
                    <div class="bg-surface rounded-2xl shadow p-6">
                        <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fas fa-battery-half text-primary"></i> Reserve Settings</h2>
                        <div class="space-y-6">
                            <div>
                                <label class="flex justify-between mb-2"><span>Reserve SOC (Primary)</span><span class="font-mono" x-text="`${pendingReserveSoc}%`"></span></label>
                                <input type="range" min="0" max="100" x-model.number="pendingReserveSoc" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                                <p class="text-xs text-gray-500 mt-1">Minimum battery level to maintain for backup power</p>
                            </div>
                            <div>
                                <label class="flex justify-between mb-2"><span>Reserve SOC 2</span><span class="font-mono" x-text="`${pendingReserveSoc2}%`"></span></label>
                                <input type="range" min="-128" max="127" x-model.number="pendingReserveSoc2" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                            </div>
                            <div class="flex gap-3">
                                <button @click="setReserveSoc(pendingReserveSoc)" :disabled="settingReserve" class="flex-1 py-3 rounded-lg bg-primary text-white font-medium disabled:opacity-50">
                                    <span x-text="settingReserve?'Applying...':'Apply Reserve SOC'"></span>
                                </button>
                                <button @click="setReserveSoc2(pendingReserveSoc2)" :disabled="settingReserve2" class="flex-1 py-3 rounded-lg bg-secondary text-white font-medium disabled:opacity-50">
                                    <span x-text="settingReserve2?'Applying...':'Apply Reserve SOC 2'"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-surface rounded-2xl shadow p-6">
                        <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fas fa-bolt text-primary"></i> Power Limits</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-sm text-gray-500">Max Charge (kW)</label>
                                <input type="number" step="0.1" x-model.number="pendingMaxCharge" class="w-full mt-1 px-3 py-2 rounded border dark:bg-gray-800">
                            </div>
                            <div>
                                <label class="text-sm text-gray-500">Max Discharge (kW)</label>
                                <input type="number" step="0.1" x-model.number="pendingMaxDischarge" class="w-full mt-1 px-3 py-2 rounded border dark:bg-gray-800">
                            </div>
                        </div>
                        <button @click="setPowerLimits()" class="w-full mt-4 py-3 rounded-lg bg-accent text-white font-medium">Apply Power Limits</button>
                    </div>
                </div>

                <!-- Raw Registers Tab -->
                <div x-show="currentTab==='raw'" x-transition class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xl font-bold">Raw Modbus Registers</h2>
                        <div class="flex items-center gap-2">
                            <input type="text" x-model="rawStartAddr" placeholder="Start (15000)" class="w-24 px-3 py-2 rounded border dark:bg-gray-800">
                            <input type="number" x-model.number="rawCount" placeholder="Count" class="w-20 px-3 py-2 rounded border dark:bg-gray-800">
                            <button @click="readRawRegisters()" :disabled="readingRaw" class="px-4 py-2 rounded-lg bg-primary text-white disabled:opacity-50">
                                <i :class="`fas fa-${readingRaw?'spinner fa-spin':'search'}`"></i>
                            </button>
                        </div>
                    </div>
                    <div class="bg-surface rounded-2xl shadow overflow-hidden">
                        <table class="w-full text-sm">
                            <thead class="bg-gray-50 dark:bg-gray-800">
                                <tr>
                                    <th class="px-4 py-3 text-left">Address</th>
                                    <th class="px-4 py-3 text-left">Hex</th>
                                    <th class="px-4 py-3 text-left">UInt16</th>
                                    <th class="px-4 py-3 text-left">Int16</th>
                                    <th class="px-4 py-3 text-left">Guess</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="reg in rawRegisters" :key="reg.addr">
                                    <tr class="border-t dark:border-gray-700">
                                        <td class="px-4 py-2 font-mono" x-text="reg.addr"></td>
                                        <td class="px-4 py-2 font-mono text-gray-500" x-text="reg.hex"></td>
                                        <td class="px-4 py-2 font-mono" x-text="reg.uint16"></td>
                                        <td class="px-4 py-2 font-mono" x-text="reg.int16"></td>
                                        <td class="px-4 py-2 text-xs" x-text="reg.guess||'-'"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <p x-show="rawRegisters.length===0" class="text-center text-gray-400 py-8">Click search to read registers</p>
                    </div>
                </div>

                <!-- Logs Tab -->
                <div x-show="currentTab==='logs'" x-transition>
                    <div class="bg-surface rounded-2xl shadow p-4">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-xl font-bold">System Logs</h2>
                            <button @click="clearLogs()" class="text-sm text-red-500 hover:underline">Clear</button>
                        </div>
                        <div class="font-mono text-xs space-y-1 max-h-96 overflow-y-auto bg-gray-900 text-green-400 p-4 rounded-lg">
                            <template x-for="log in logs" :key="log.id">
                                <div :class="`text-${log.level==='error'?'red':log.level==='warning'?'amber':'green'}-400`">
                                    <span class="text-gray-500" x-text="`[${log.time}]`"></span>
                                    <span x-text="log.message"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
