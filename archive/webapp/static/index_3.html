    <!-- Settings Slide-over -->
    <div x-show="settingsOpen" class="fixed inset-0 z-30" style="display:none">
        <div @click="settingsOpen=false" class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
        <div x-show="settingsOpen" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full" class="absolute right-0 top-0 h-full w-full max-w-md bg-surface shadow-xl overflow-y-auto">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold">Settings</h2>
                    <button @click="settingsOpen=false" class="w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-times"></i></button>
                </div>
                
                <!-- Connection -->
                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3">Modbus</h3>
                    <input type="text" x-model="config.modbus.host" placeholder="Host" class="w-full mb-2 px-3 py-2 rounded border dark:bg-gray-800 dark:border-gray-600">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" x-model.number="config.modbus.port" placeholder="Port" class="px-3 py-2 rounded border dark:bg-gray-800">
                        <input type="number" x-model.number="config.modbus.unit_id" placeholder="Unit ID" class="px-3 py-2 rounded border dark:bg-gray-800">
                    </div>
                </div>
                
                <!-- MQTT -->
                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3">MQTT</h3>
                    <input type="text" x-model="config.mqtt.host" placeholder="Broker Host" class="w-full mb-2 px-3 py-2 rounded border dark:bg-gray-800">
                    <input type="number" x-model.number="config.mqtt.port" placeholder="Port" class="w-full px-3 py-2 rounded border dark:bg-gray-800">
                </div>
                
                <!-- Theme -->
                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3">Appearance</h3>
                    <select x-model="theme" @change="applyTheme()" class="w-full mb-3 px-3 py-2 rounded border dark:bg-gray-800">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="auto">Auto</option>
                    </select>
                    <div class="flex gap-2 flex-wrap">
                        <template x-for="c in ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4']">
                            <button @click="setPrimaryColor(c)" :class="`w-8 h-8 rounded-full ${config.theme.primary_color===c?'ring-2 ring-gray-800 dark:ring-white':''}`" :style="`background:${c}`"></button>
                        </template>
                    </div>
                </div>
                
                <!-- Widgets -->
                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3">Widgets</h3>
                    <template x-for="(w,k) in config.widgets" :key="k">
                        <div class="flex items-center justify-between p-3 mb-2 rounded bg-gray-50 dark:bg-gray-800">
                            <span class="capitalize" x-text="k.replace('_',' ')"></span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" x-model="w.enabled" class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-200 peer-checked:bg-primary rounded-full peer after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
                            </label>
                        </div>
                    </template>
                </div>
                
                <button @click="saveSettings()" :disabled="saving" class="w-full py-3 rounded-lg bg-primary text-white font-medium disabled:opacity-50">
                    <span x-text="saving?'Saving...':'Save Settings'"></span>
                </button>
            </div>
        </div>
    </div>
