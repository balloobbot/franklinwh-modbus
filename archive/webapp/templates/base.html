<!DOCTYPE html>
<html lang="en" x-data="franklinWHApp()" x-init="init(); loadCurrentPowerLimits();"
    :class="{ 'dark': theme === 'dark' }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FranklinWH Battery Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Chart.js for metrics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Alpine.js x-cloak - hide elements before Alpine initializes -->
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: 'var(--color-primary)',
                        secondary: 'var(--color-secondary)',
                        accent: 'var(--color-accent)',
                        surface: 'var(--color-surface)',
                        background: 'var(--color-background)',
                    }
                }
            }
        }

        // Global toast helper
        window.showToast = function (message, type = 'info') {
            window.dispatchEvent(new CustomEvent('notify', { detail: { message, type } }));
        }
    </script>
</head>

<body class="bg-background text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex text-sm"
    @notify.window="addToast($event.detail.message, $event.detail.type)">

    <!-- Sidebar -->
    <aside
        class="fixed inset-y-0 left-0 z-50 bg-surface border-r border-gray-200 dark:border-gray-800 transform transition-all duration-300 lg:translate-x-0 lg:static lg:inset-0 shadow-xl lg:shadow-none"
        :class="{
            'translate-x-0': sidebarOpen, 
            '-translate-x-full': !sidebarOpen,
            'w-64': !sidebarCollapsed || !sidebarOpen,
            'w-16': sidebarCollapsed && sidebarOpen
        }">
        <div class="h-full flex flex-col">
            <!-- Logo -->
            <div class="h-16 flex items-center px-4 border-b border-gray-200 dark:border-gray-800 gap-3"
                :class="sidebarCollapsed ? 'justify-center px-2' : ''">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-blue-500/20 flex-shrink-0">
                    F
                </div>
                <div class="overflow-hidden transition-all duration-200"
                    :class="sidebarCollapsed ? 'w-0 opacity-0' : 'w-auto opacity-100'">
                    <h1 class="font-bold text-lg tracking-tight whitespace-nowrap">FranklinWH</h1>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest font-semibold whitespace-nowrap">
                        Battery Manager</p>
                </div>
                <!-- Collapse Toggle (Desktop) -->
                <button @click="sidebarCollapsed = !sidebarCollapsed"
                    class="hidden lg:flex ml-auto w-6 h-6 rounded hover:bg-gray-100 dark:hover:bg-gray-800 items-center justify-center text-gray-400"
                    :class="sidebarCollapsed ? 'absolute right-2' : ''" title="Toggle Sidebar">
                    <i class="fas fa-chevron-left text-xs transition-transform"
                        :class="sidebarCollapsed ? 'rotate-180' : ''"></i>
                </button>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto" :class="sidebarCollapsed ? 'px-2' : 'px-3'">
                <template x-for="item in navItems" :key="item.id">
                    <button
                        @click="item.href ? (window.location.href = item.href) : (currentTab = item.id); if(window.innerWidth < 1024) sidebarOpen = false"
                        class="w-full flex items-center rounded-lg transition-all duration-200 group relative overflow-hidden"
                        :class="[
                            currentTab === item.id ? 'bg-primary/10 text-primary font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-200',
                            sidebarCollapsed ? 'justify-center px-2 py-3' : 'gap-3 px-3 py-2.5'
                        ]" :title="sidebarCollapsed ? item.label : ''">

                        <div class="absolute inset-0 bg-primary/10 opacity-0 transition-opacity"
                            :class="currentTab === item.id ? 'opacity-100' : 'group-hover:opacity-50 opacity-0'"></div>

                        <i
                            :class="`fas ${item.icon} text-center transition-colors relative z-10 ${currentTab === item.id ? 'text-primary' : 'text-gray-400 group-hover:text-gray-500'} ${sidebarCollapsed ? 'w-5 text-lg' : 'w-5'}`"></i>
                        <span x-text="item.label"
                            class="relative z-10 whitespace-nowrap transition-opacity duration-200"
                            :class="sidebarCollapsed ? 'opacity-0 w-0 overflow-hidden' : 'opacity-100'"></span>

                        <div x-show="currentTab === item.id && !sidebarCollapsed"
                            class="absolute right-0 w-1 h-6 bg-primary rounded-l-full">
                        </div>
                        <div x-show="currentTab === item.id && sidebarCollapsed"
                            class="absolute right-0 top-1/2 -translate-y-1/2 w-1 h-4 bg-primary rounded-l-full">
                        </div>
                    </button>
                </template>

                <!-- Separator -->
                <div class="my-4 border-t border-gray-200 dark:border-gray-800"></div>

                <!-- Administration Expandable Menu -->
                <div class="space-y-1" x-data="{ init() { this.checkAdminActive() } }" x-init="init()">
                    <!-- Admin Header Button -->
                    <button @click="adminExpanded = !adminExpanded"
                        class="w-full flex items-center rounded-lg transition-all duration-200 group relative overflow-hidden"
                        :class="[
                            isAdminActive ? 'bg-primary/10 text-primary font-medium' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-200',
                            sidebarCollapsed ? 'justify-center px-2 py-3' : 'gap-3 px-3 py-2.5'
                        ]" :title="sidebarCollapsed ? adminMenu.label : ''">

                        <div class="absolute inset-0 bg-primary/10 opacity-0 transition-opacity"
                            :class="isAdminActive ? 'opacity-100' : 'group-hover:opacity-50 opacity-0'"></div>

                        <i
                            :class="`fas ${adminMenu.icon} text-center transition-colors relative z-10 ${isAdminActive ? 'text-primary' : 'text-gray-400 group-hover:text-gray-500'} ${sidebarCollapsed ? 'w-5 text-lg' : 'w-5'}`"></i>
                        <span x-text="adminMenu.label"
                            class="relative z-10 whitespace-nowrap transition-opacity duration-200 flex-1 text-left"
                            :class="sidebarCollapsed ? 'opacity-0 w-0 overflow-hidden' : 'opacity-100'"></span>

                        <!-- Expand/Collapse Icon -->
                        <i x-show="!sidebarCollapsed"
                            class="fas fa-chevron-down text-xs transition-transform duration-200 relative z-10"
                            :class="adminExpanded ? 'rotate-180' : ''"></i>

                        <div x-show="isAdminActive && !sidebarCollapsed"
                            class="absolute right-0 w-1 h-6 bg-primary rounded-l-full"></div>
                        <div x-show="isAdminActive && sidebarCollapsed"
                            class="absolute right-0 top-1/2 -translate-y-1/2 w-1 h-4 bg-primary rounded-l-full"></div>
                    </button>

                    <!-- Admin Submenu -->
                    <div x-show="adminExpanded && !sidebarCollapsed" x-collapse class="space-y-1">
                        <template x-for="section in adminMenu.sections" :key="section.label">
                            <div class="pt-1">
                                <!-- Section Label -->
                                <div x-show="!sidebarCollapsed"
                                    class="px-3 py-1 text-[10px] font-semibold text-gray-400 uppercase tracking-wider"
                                    x-text="section.label"></div>

                                <!-- Section Items -->
                                <div class="space-y-0.5">
                                    <template x-for="item in section.items" :key="item.id">
                                        <button
                                            @click="item.href ? window.location.href = item.href : (currentTab = item.id); if(window.innerWidth < 1024) sidebarOpen = false"
                                            class="w-full flex items-center rounded-lg transition-all duration-200 group relative overflow-hidden"
                                            :class="[
                                                (item.href ? window.location.pathname === item.href : currentTab === item.id) ? 'bg-primary/5 text-primary font-medium' : 'text-gray-500 dark:text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-800/50 hover:text-gray-700 dark:hover:text-gray-300',
                                                'gap-3 px-3 py-2 pl-10'
                                            ]">
                                            <i
                                                :class="`fas ${item.icon} w-4 text-center text-xs ${(item.href ? window.location.pathname === item.href : currentTab === item.id) ? 'text-primary' : 'text-gray-400'}`"></i>
                                            <span x-text="item.label" class="text-sm whitespace-nowrap"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </nav>

            <!-- Status Footer -->
            <div class="p-4 border-t border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-900/50 backdrop-blur-sm"
                :class="sidebarCollapsed ? 'p-2' : 'p-4'">
                <div class="flex items-center gap-3" :class="sidebarCollapsed ? 'justify-center' : ''">
                    <div class="relative">
                        <div class="w-2.5 h-2.5 rounded-full" :class="connected ? 'bg-emerald-500' : 'bg-red-500'">
                        </div>
                        <div class="absolute inset-0 rounded-full animate-ping opacity-75"
                            :class="connected ? 'bg-emerald-500' : 'bg-red-500'"></div>
                    </div>
                    <div class="overflow-hidden transition-all duration-200"
                        :class="sidebarCollapsed ? 'w-0 opacity-0' : 'w-auto opacity-100'">
                        <p class="text-xs font-medium" x-text="connected ? 'Live Data' : 'Disconnected'"></p>
                        <p class="text-[10px] text-gray-500"
                            x-text="lastUpdate ? 'Updated ' + formatTime(lastUpdate) : 'Waiting for data...'"></p>
                        <p class="text-[10px] text-gray-400 mt-1">v1.2.2</p>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Mobile Overlay -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity
        class="fixed inset-0 bg-black/50 z-40 lg:hidden backdrop-blur-sm"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 bg-gray-50/50 dark:bg-gray-900/50">
        <!-- Header -->
        <header
            class="h-16 bg-surface/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-30 transition-all duration-200">
            <button @click="sidebarOpen = !sidebarOpen"
                class="w-10 h-10 -ml-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition-colors"
                :class="sidebarOpen ? 'text-primary' : ''">
                <i class="fas" :class="sidebarOpen ? 'fa-times' : 'fa-bars'"></i>
            </button>

            <!-- Status Badges -->
            <div class="flex items-center gap-3 text-xs font-medium">
                <!-- TEST WATERMARK BANNER -->
                <div
                    class="px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg shadow-lg animate-pulse font-bold text-sm flex items-center gap-2">
                    <i class="fas fa-battery-bolt"></i>
                    BATTERY CONTROL TEST v1.2.3
                </div>

                <!-- aGate Connection Badge -->
                <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium"
                    :class="connected ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/20 dark:text-emerald-400' : 'bg-red-50 text-red-700 dark:bg-red-900/20 dark:text-red-400'">
                    <span class="w-2 h-2 rounded-full"
                        :class="connected ? 'bg-emerald-600 animate-pulse' : 'bg-red-600'"></span>
                    <span class="font-semibold">aGate:</span>
                    <span class="font-mono" x-text="deviceStatus.serial || '--'" x-show="deviceStatus.serial"></span>
                    <span class="text-gray-300 dark:text-gray-600">|</span>
                    <span
                        x-text="deviceStatus.chargingStatus === 'Idle' ? 'Standby' : (deviceStatus.chargingStatus || '--')"
                        x-show="deviceStatus.chargingStatus"></span>
                    <span class="text-gray-300 dark:text-gray-600" x-show="deviceStatus.controlMode">|</span>
                    <span class="cursor-pointer hover:opacity-80" x-show="deviceStatus.controlMode"
                        @click="deviceStatus.controlMode === 'LOCAL' ? (controlStatus.warning = true, sessionStorage.removeItem('controlWarningShown')) : null"
                        :class="deviceStatus.controlMode === 'REMOTE' ? '' : 'font-semibold'"
                        x-text="deviceStatus.controlMode === 'LOCAL' ? 'No Control' : 'Active'"></span>
                </div>

                <!-- Grid Badge -->
                <span class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium"
                    x-show="deviceStatus.gridStatus"
                    :class="deviceStatus.gridStatus === 'Connected' ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/20 dark:text-emerald-400' : 'bg-red-50 text-red-700 dark:bg-red-900/20 dark:text-red-400'">
                    <span class="w-2 h-2 rounded-full"
                        :class="deviceStatus.gridStatus === 'Connected' ? 'bg-emerald-600 animate-pulse' : 'bg-red-600'"></span>
                    Grid
                </span>

                <!-- MQTT Badge -->
                <span class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium"
                    :class="mqttStats.messages_published > 0 ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/20 dark:text-emerald-400' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'">
                    <span class="w-2 h-2 rounded-full"
                        :class="mqttStats.messages_published > 0 ? 'bg-emerald-600 animate-pulse' : 'bg-gray-400'"></span>
                    MQTT
                </span>

                <!-- Mobile: Simple connection indicator -->
                <div class="lg:hidden flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium"
                    :class="connected ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'">
                    <span class="w-2 h-2 rounded-full"
                        :class="connected ? 'bg-emerald-600 animate-pulse' : 'bg-red-600'"></span>
                    <span x-text="connected ? 'Connected' : 'Offline'"></span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Mobile Status Indicator -->
                <div class="lg:hidden flex items-center mr-2">
                    <div class="relative w-2.5 h-2.5">
                        <div class="w-2.5 h-2.5 rounded-full" :class="connected ? 'bg-emerald-500' : 'bg-red-500'">
                        </div>
                        <div class="absolute inset-0 rounded-full animate-ping opacity-75"
                            :class="connected ? 'bg-emerald-500' : 'bg-red-500'"></div>
                    </div>
                </div>

                <!-- Auto Refresh Toggle -->
                <button @click="config.auto_refresh = !config.auto_refresh"
                    class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-all"
                    :class="config.auto_refresh ? 'bg-primary/10 text-primary ring-1 ring-primary/20' : 'bg-gray-100 dark:bg-gray-800 text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700'">
                    <div class="w-8 h-4 rounded-full relative transition-colors duration-200"
                        :class="config.auto_refresh ? 'bg-primary' : 'bg-gray-300 dark:bg-gray-600'">
                        <div class="absolute top-0.5 left-0.5 w-3 h-3 rounded-full bg-white shadow-sm transition-transform duration-200"
                            :class="config.auto_refresh ? 'translate-x-4' : 'translate-x-0'"></div>
                    </div>
                    <span>Auto</span>
                </button>

                <div class="h-4 w-px bg-gray-200 dark:bg-gray-700 mx-2 hidden sm:block"></div>

                <span
                    class="text-xs text-gray-600 dark:text-gray-300 hidden sm:flex items-center font-mono px-2.5 py-1 rounded-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700"
                    x-text="`Next: ${String(nextRefresh).padStart(2, '0')}s`"></span>
                <button @click="refreshData()"
                    class="w-9 h-9 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition-all active:scale-95"
                    :class="{'animate-spin text-primary': refreshing}">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button @click="settingsOpen = true"
                    class="w-9 h-9 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition-all active:scale-95">
                    <i class="fas fa-cog"></i>
                </button>

                <!-- Version Badge -->
                <span
                    class="hidden sm:flex text-[10px] text-gray-600 dark:text-gray-300 font-mono font-semibold px-2.5 py-1 rounded-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">v1.2.2</span>
            </div>
        </header>


        <!-- Backend Connection Lost Banner -->
        <div x-show="backendConnected === false" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 -translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-300" x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 -translate-y-4"
            class="fixed top-0 left-0 right-0 z-50 bg-red-600 text-white px-4 py-2 shadow-lg">
            <div class="max-w-7xl mx-auto flex items-center justify-center gap-3">
                <i class="fas fa-exclamation-triangle animate-pulse"></i>
                <span class="font-medium">Lost connection to backend server</span>
                <span class="text-red-200 text-sm">• Retrying...</span>
            </div>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 lg:p-8 overflow-y-auto" x-cloak :class="backendConnected === false ? 'pt-12' : ''">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Application Logic -->
    <script src="/static/js/app.js?v=1.2.3"></script>

    {% include 'settings_modal.html' ignore missing %}
    {% include 'reset_modal.html' ignore missing %}

</body>

</html>
